name: Marketplace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
  intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-documents.txt pglast==8.7
      - run: python -m compileall -q app.py persona.py documents
      - run: python ../../scripts/parse-marketplace-sql.py
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-documents.txt

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LOCKD internal decision-support service. Review cost and authorize before deployment.
Parameters:
  Environment:
    Type: String
    AllowedValues: [development, staging, production]
  AuthorizedCallerArn:
    Type: String
    AllowedPattern: '^arn:aws:(iam|sts)::[0-9]{12}:.+$'
    Description: Exact caller ARN, or an assumed-role session ARN prefix ending in a slash. Configure a trusted backend identity with Function URL invocation permissions separately.
Resources:
  Intelligence:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/intelligence/
      Handler: lambda_entry.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 10
      ReservedConcurrentExecutions: 1
      FunctionUrlConfig:
        AuthType: AWS_IAM
      Environment:
        Variables:
          INTELLIGENCE_CALLER_ARN: !Ref AuthorizedCallerArn
      Tags:
        Application: LOCKD
        Environment: !Ref Environment
  IntelligenceLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${Intelligence}
      RetentionInDays: 14
Outputs:
  InternalFunctionUrl:
    Value: !GetAtt IntelligenceUrl.FunctionUrl

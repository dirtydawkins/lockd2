services:
  - type: web
    name: lockd-intelligence
    runtime: python
    plan: free
    region: frankfurt
    branch: codex/marketplace-foundations
    rootDir: services/intelligence
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --limit-concurrency 20 --timeout-keep-alive 5
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: INTELLIGENCE_SHARED_SECRET
        sync: false
